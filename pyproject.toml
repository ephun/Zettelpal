[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "zettelpal"
version = "2.1.0"
description = "Privacy-focused audio-to-Obsidian notes pipeline using local models"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.11"
authors = [
    {name = "Ethan"}
]
keywords = [
    "obsidian",
    "zettelkasten",
    "audio",
    "transcription",
    "whisper",
    "local-llm",
    "privacy"
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Environment :: Win32 (MS Windows)",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Multimedia :: Sound/Audio :: Speech",
    "Topic :: Text Processing :: General",
]
dependencies = [
    "openai-whisper>=20231117",
    "sentence-transformers>=2.2.2",
    "torch>=2.0.0",
    "numpy>=1.24.0",
    "scikit-learn>=1.3.0",
    "requests>=2.31.0",
    "pydantic-settings>=2.2.0",
    "typer>=0.12.0",
]

[project.optional-dependencies]
dev = [
    "pyinstaller>=6.0.0",
    "pytest>=7.0.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[project.scripts]
zettelpal = "zettelpal.cli:main"
zettelpal-delete = "zettelpal.delete_notes:main"
zettelpal-check = "zettelpal.vault.checker:main"

[project.gui-scripts]
zettelpal-gui = "zettelpal.gui:main"

[project.urls]
Homepage = "https://github.com/ephun/Zettelpal"
Repository = "https://github.com/ephun/Zettelpal"

[tool.setuptools]
packages = ["zettelpal", "zettelpal.vault"]

[tool.setuptools.package-data]
zettelpal = ["*.ico"]
